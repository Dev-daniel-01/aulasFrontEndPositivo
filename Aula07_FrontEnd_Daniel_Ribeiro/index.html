<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./estilos/style.css">
    <title>introdução ao Javascript</title>
</head>

<body>
    <main class="container py-4">
        <h1 class="text-center mb-5">Olá JavaScript</h1>

        <!-- ATIVIDADE 1 -->
        <section class="col-12 col-md-8 col-lg-5 mx-auto">
            <h2 class="fw-bold">Atividade 1</h2>
            <h3 class="h5 text-muted mb-4">Antecessor e Sucessor</h3>

            <form id="formulario" class="d-flex flex-column gap-3">
                <input type="number" class="form-control" id="numero" name="numero"
                    placeholder="Digite um número inteiro" required>

                <button type="submit" class="btn btn-primary btn-lg">
                    Calcular antecessor e sucessor
                </button>

                <p id="resultado" class="mb-0">O resultado aparecerá aqui!</p>
            </form>
        </section>

        <hr class="my-5">

        <!-- ATIVIDADE 2 -->
        <section class="col-12 col-md-8 col-lg-5 mx-auto">
            <h2 class="fw-bold">Atividade 2</h2>
            <h3 class="h5 text-muted mb-4">Reajuste Salarial</h3>

            <form id="formulario2" class="d-flex flex-column gap-3">
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite o nome do funcionário"
                    required>

                <input type="number" class="form-control" id="salario" name="salario"
                    placeholder="Digite o salário atual" step="any" min="0" required>

                <div class="input-group">
                    <input type="number" class="form-control" id="reajuste" name="reajuste"
                        placeholder="Digite o reajuste" step="any" required>
                    <span class="input-group-text">%</span>
                </div>

                <button type="submit" class="btn btn-calcular btn-lg border border-dark">
                    Calcular Novo Salário
                </button>

                <p id="resultadoSalario" class="mb-0">O resultado aparecerá aqui!</p>
            </form>
        </section>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="./scripts/script.js"></script>

</body>

</html>
