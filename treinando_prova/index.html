<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./estilos/style.css">
    <title>Treino bootstrap para prova</title>
</head>
<script>
    function enviarFormulario(event) {
        event.preventDefault()
        alert("Formulario enviado com sucesso")
        event.target.reset();
    }
</script>

<body>
    <main class="container-fluid  bg-body-secondary p-2">
        <nav class="navbar navbar-expand navbar-dark w-100 justify-content-center">
            <ul class="navbar-nav d-flex gap-5 ">
                <li class="nav-item"><a href="#" class="nav-link text-dark">Teste</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">Teste</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">Teste</a></li>
            </ul>
        </nav>
        <section class="container-fluid border border-secondary rounded p-3">
            <div class="row align-items-center">
                <div class="col border-end pe-4">
                    <div>
                        <h1>Olá, precisa de ajuda?</h1>
                        <p>Se precisar pode entrar em contato conosco com o formulario ao lado!</p>
                    </div>
                    <form onsubmit="enviarFormulario(event)">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="Digite seu e-mail" required>
                        </div>
                        <div class="mb-3">
                            <label for="mensagem" class="form-label">Mensagem</label>
                            <textarea class="form-control" id="mensagem" name="mensagem" rows="3"
                                placeholder="Escreva sua mensagem" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar</button>
                    </form>
                </div>
                <div class="col">
                    <img src="./assets/images/fundo-form.avif" alt="fundo" class="rounded w-100">
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
