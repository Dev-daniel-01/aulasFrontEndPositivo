<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./estilos/style.css">
    <title>Estruturas de programação em JS</title>
</head>
<body>
    <h1>furacao</h1>
    <fieldset>
        <legend>Processos Disponiveis</legend>
        <button onclick="totaliza()">Totalizar Estoque</button>
        <button onclick="calculaSituacao()">Calcular Situação do Aluno</button>
    </fieldset>

    <fieldset>
        <legend>Atividade 2 - Alunos</legend>
        <button onclick="listaAlunos()">Listar Alunos</button>

    <fieldset>
        <legend>Atividade 3 - Atletas</legend>
        <button onclick="listaAtletas()">Listar Atletas</button>
        <button onclick="atletaMaisAlto()">Atleta Mais Alto</button>
        <button onclick="atletaMaisVelho()">Atleta Mais Velho</button>

    </fieldset>

    <div id="resultado"></div>

    <script src="./scripts/script.js"></script>
